services:
  - type: web
    name: site-ear-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python ml_pipeline.py train
    startCommand: uvicorn backend:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FRONTEND_ORIGINS
        sync: false
